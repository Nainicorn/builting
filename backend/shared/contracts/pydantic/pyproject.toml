[project]
name = "builting-contracts"
version = "0.1.0"
description = "Pipeline boundary contracts — Pydantic side. Paired with @builting/contracts (Zod)."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["builting_contracts"]
